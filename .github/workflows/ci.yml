name: Phoenix CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///file:phoenix_ci?mode=memory&cache=shared&uri=true
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: test_secret_ci
      ENVIRONMENT: test
      AUTO_ORCHESTRATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: phoenix
          POSTGRES_DB: phoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phoenix -d phoenix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://phoenix:phoenix@localhost:5432/phoenix
      ENVIRONMENT: test
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: test_secret_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
